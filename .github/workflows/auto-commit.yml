name: Auto Commit

on:
  schedule:
    - cron: '0 0,12 * * *'  # Runs at 00:00 and 12:00 UTC (twice daily)
  workflow_dispatch:

permissions:
  contents: write  # Needed to commit and push

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and validate packages
        id: build-test
        run: |
          # Build both packages (creates ./result symlinks)
          echo "Building opencode..."
          nix build .#opencode
          echo "Building opencode-avx..."
          nix build .#opencode-avx
          
          # Start OpenCode server for health check using the built binary
          echo "Starting OpenCode server..."
          ./result/bin/opencode serve --port 4096 > opencode-server.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4096/global/health > /dev/null; then
              echo "OpenCode server is healthy"
              break
            fi
            sleep 1
          done
          
          # Check if server started successfully
          if ! curl -s http://127.0.0.1:4096/global/health > /dev/null; then
            echo "Failed to start OpenCode server"
            cat opencode-server.log
            kill $SERVER_PID || true
            exit 1
          fi
          
          # Stop server
          kill $SERVER_PID || true
          echo "Build and validation completed successfully"

      - name: Update timestamp file
        if: steps.build-test.outcome == 'success'
        run: |
          # Create or update a timestamp file
          echo "Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" > timestamp.txt
          echo "Commit triggered by GitHub Actions at $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> timestamp.txt
          echo "" >> timestamp.txt  # Add empty line for readability

      - name: Commit changes
        if: steps.build-test.outcome == 'success'
        run: |
          git add timestamp.txt
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update timestamp [skip ci]"
            echo "Changes committed"
          else
            echo "No changes to commit"
            exit 0
          fi

      - name: Push changes
        if: steps.build-test.outcome == 'success'
        run: |
          git push origin HEAD:${{ github.ref }}
          echo "Changes pushed successfully"
