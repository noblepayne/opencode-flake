name: Auto Update

on:
  schedule:
    - cron: '0 0,12 * * *'  # Twice daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run update script
        id: update
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run update.sh - it uses nix-update --commit, so it creates commits if there are changes
          chmod +x ./update.sh
          ./update.sh
          
          # Check if any new commits were made
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "updates_found=true" >> $GITHUB_OUTPUT
          else
            echo "updates_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and validate updates
        if: steps.update.outputs.updates_found == 'true'
        run: |
          echo "Updates found, validating build..."
          nix build .#opencode
          nix build .#opencode-avx
          
          echo "Validating binaries..."
          ./result/bin/opencode --version
          
          # We don't have a result-opencode-avx link unless we specify it, 
          # but we built it. Let's just run it via nix run or similar.
          nix run .#opencode-avx -- --version

      - name: Push updates
        if: steps.update.outputs.updates_found == 'true'
        run: |
          # Amend commits to add [skip ci] if we want to prevent re-triggering, 
          # but since it's a schedule, it's fine. 
          # However, let's push the new commits.
          git push origin main
