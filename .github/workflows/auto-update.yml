name: Auto Update

on:
  schedule:
    - cron: '0 0,12 * * *'  # Twice daily
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs against the same ref. Without this, a manual dispatch landing
# during a scheduled run (or two schedules overlapping) can both commit and then
# both `git push origin main` — the loser gets a non-fast-forward rejection and
# its version bump is discarded with no trace. Queue rather than cancel: a
# half-finished updater is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run update script
        id: update
        env:
          INITIAL_SHA: ${{ github.sha }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # update.sh is v2-only now (see the comment in update.sh for why v1 is
          # excluded). The devShell supplies the curl + python3 that
          # update-v2.sh actually uses.
          chmod +x ./update.sh
          nix develop --command ./update.sh

          # Compare against the commit we started from, not origin/main: the
          # working tree is clean at this point, so a dirty-tree check is the
          # same signal without depending on remote-tracking ref freshness.
          if [ -n "$(git status --porcelain)" ]; then
            echo "update.sh left uncommitted changes:"
            git status --porcelain
            git diff
            echo "::error::update.sh modified the tree without committing — refusing to push"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${INITIAL_SHA}" ]; then
            echo "updates_found=true" >> $GITHUB_OUTPUT
          else
            echo "updates_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and validate updates (v2)
        if: steps.update.outputs.updates_found == 'true'
        run: |
          echo "Updates found, validating v2 build..."
          nix build .#opencode2 .#opencode2-avx

          echo "Validating v2 binaries..."
          nix run .#opencode2 -- --version
          nix run .#opencode2-avx -- --version

      # v1 is frozen legacy (see update.sh). Still worth proving it builds, but
      # it must never block a v2 update: upstream retiring a v1 release asset
      # would otherwise freeze v2 automation again.
      - name: Build and validate v1 (legacy, advisory)
        if: steps.update.outputs.updates_found == 'true'
        continue-on-error: true
        run: |
          nix build .#opencode .#opencode-avx
          nix run .#opencode -- --version
          nix run .#opencode-avx -- --version

      - name: Push updates
        if: steps.update.outputs.updates_found == 'true'
        run: |
          git push origin main
