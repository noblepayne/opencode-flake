name: Update Flake Packages (Weekly PR)

on:
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run update script on a temporary branch
        id: update
        run: |
          # Create and switch to a temporary branch
          git checkout -b update-flake-${{ github.run_id }}

          INITIAL_COMMIT=$(git rev-parse HEAD)
          echo "initial_commit=$INITIAL_COMMIT" >> $GITHUB_OUTPUT

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update flake inputs
          nix flake update

          # Check if any new commits were made
          if [ "$(git rev-parse HEAD)" != "${{ steps.update.outputs.initial_commit }}" ]; then
            echo "updates_found=true" >> $GITHUB_OUTPUT
          else
            echo "updates_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and validate updates
        if: steps.update.outputs.updates_found == 'true'
        run: |
          echo "Updates found, validating build..."
          nix build .#opencode
          nix build .#opencode-avx

          echo "Validating binaries..."
          ./result/bin/opencode --version
          nix run .#opencode-avx -- --version

      - name: Push branch
        if: steps.update.outputs.updates_found == 'true'
        run: git push origin update-flake-${{ github.run_id }}

      - name: Create PR
        if: steps.update.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated flake input updates"
          branch: update-flake-${{ github.run_id }}
          base: main
          delete-branch: true
          title: "chore: weekly flake input updates"
          body: |
            Weekly automated flake input updates via `nix flake update`.

            This PR was generated by the Flake Update GitHub Action after successful build validation.
          labels: automated-pr
