name: Update Flake Packages

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # Needed to commit and push flake updates
  pull-requests: write  # Needed to create PRs

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git operations

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and test packages
        id: build-test
        run: |
          # Build both packages (creates ./result symlinks)
          echo "Building opencode..."
          nix build .#opencode
          echo "Building opencode-avx..."
          nix build .#opencode-avx
          
          # Validate that the binaries work by running version check
          echo "Validating opencode binary..."
          ./result/bin/opencode --version
          echo "Validating opencode-avx binary..."
          ./result/bin/opencode-avx --version
          
          echo "Build and test completed successfully"

      - name: Run update script
        if: steps.build-test.outcome == 'success'
        run: |
          # Make update script executable if needed
          chmod +x ./update.sh
          # Run the update script (this will commit changes if any)
          ./update.sh

      - name: Push changes
        if: steps.build-test.outcome == 'success'
        run: |
          git push origin HEAD:${{ github.ref }}
          echo "Changes pushed successfully"

      - name: Create pull request
        if: |
          steps.build-test.outcome == 'success' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake packages via update.sh"
          branch: update-flake-${{ github.sha }}
          title: "chore: update flake packages"
          body: |
            Automated flake package updates
            
            This PR was generated by the Update Flake Packages GitHub Action.
            It runs the update.sh script after verifying build and OpenCode binary health.
          labels: automated-pr
          assignees: ${{ github.actor }}
