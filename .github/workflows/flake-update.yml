name: Update Flake Packages (Weekly PR)

on:
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # NOTE: this step deliberately does NOT commit and does NOT push.
      #
      # It used to `git checkout -b`, `git commit`, then `git push`, and hand the
      # branch to peter-evans/create-pull-request. That combination is broken:
      # the action only re-applies commits made ON TOP OF the base branch, so a
      # commit made on the base itself produces an empty rebase set. The action
      # then reset the branch to main, logged "Branch no longer differs from base
      # branch 'main'", and deleted it — discarding the flake.lock update with
      # exit code 0.
      #
      # Symptom: this workflow was green every week and had opened zero PRs
      # ever; flake.lock was pinned to nixpkgs 2026-03-28 for ~6 months.
      # The action now owns the branch and commits the working-tree diff.
      - name: Update flake inputs
        id: update
        run: |
          nix flake update
          git add flake.lock
          if git diff --cached --quiet -- flake.lock; then
            echo "flake.lock unchanged — nothing to do"
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "flake.lock updated:"
            git diff --cached --stat -- flake.lock
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate updates (v2)
        if: steps.update.outputs.updates_found == 'true'
        run: |
          echo "Inputs updated, validating v2 build..."
          nix build .#opencode2 .#opencode2-avx

          echo "Validating v2 binaries..."
          nix run .#opencode2 -- --version
          nix run .#opencode2-avx -- --version

      # v1 is frozen legacy (see update.sh) — advisory only, never blocks the PR.
      - name: Build and validate v1 (legacy, advisory)
        if: steps.update.outputs.updates_found == 'true'
        continue-on-error: true
        run: |
          nix build .#opencode .#opencode-avx
          nix run .#opencode -- --version
          nix run .#opencode-avx -- --version

      - name: Create PR
        if: steps.update.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Stage the working-tree diff. Required so a dirty tree can't smuggle
          # anything else into the PR.
          add-paths: flake.lock
          # Fixed branch name: this action updates ONE rolling PR instead of
          # opening a new one every week, so a run that finds nothing new
          # simply closes it.
          branch: update-flake
          delete-branch: true
          commit-message: "chore: automated flake input updates"
          title: "chore: weekly flake input updates"
          body: |
            Weekly automated `nix flake update`, opened only after the v2 build
            and `--version` checks passed.

            This is a rolling PR — it is updated in place each week and closes
            automatically when `flake.lock` stops changing.
          labels: automated-pr