name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build opencode package
        run: nix build .#opencode

      - name: Build opencode-avx package
        run: nix build .#opencode-avx

      - name: Start OpenCode server
        id: opencode-server
        run: |
          # Start the server in the background
          nohup opencode serve --port 4096 > opencode-server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > opencode-server.pid
          
          # Wait for server to start (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4096/global/health > /dev/null; then
              echo "OpenCode server is healthy"
              exit 0
            fi
            sleep 1
          done
          
          echo "Failed to start OpenCode server"
          cat opencode-server.log
          exit 1

      - name: Check OpenCode health
        if: steps.opencode-server.outcome == 'success'
        run: |
          curl -s http://127.0.0.1:4096/global/health
          echo "Health check passed"

      - name: Stop OpenCode server
        if: always()
        run: |
          if [ -f opencode-server.pid ]; then
            kill $(cat opencode-server.pid) || true
            rm opencode-server.pid
          fi