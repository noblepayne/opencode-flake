name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build opencode package
        run: nix build .#opencode

      - name: Build opencode-avx package
        run: nix build .#opencode-avx

      - name: Validate opencode binary
        run: ./result/bin/opencode --version

      - name: Validate opencode-avx binary
        run: ./result/bin/opencode-avx --version
