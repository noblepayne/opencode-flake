name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and validate opencode packages
        run: |
          # Build all opencode packages (creates ./result symlinks)
          echo "Building opencode packages..."
          nix build .#opencode .#opencode-avx .#opencode2 .#opencode2-avx
          
          # Validate that the binaries work by running version checks
          echo "Validating opencode binaries..."
          nix run .#opencode -- --version
          nix run .#opencode-avx -- --version
          nix run .#opencode2 -- --version
          nix run .#opencode2-avx -- --version
          
          echo "Build and validation completed successfully"
