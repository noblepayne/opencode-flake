name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build opencode package
        run: nix build .#opencode --no-link

      - name: Build opencode-avx package
        run: nix build .#opencode-avx --no-link

      - name: Start OpenCode server
        id: opencode-server
        run: |
          # Start the server in the background using the built binary
          echo "Starting OpenCode server from opencode build..."
          ./result/bin/opencode serve --port 4096 > opencode-server.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4096/global/health > /dev/null; then
              echo "OpenCode server is healthy"
              break
            fi
            sleep 1
          done
          
          # Check if server started successfully
          if ! curl -s http://127.0.0.1:4096/global/health > /dev/null; then
            echo "Failed to start OpenCode server"
            cat opencode-server.log
            kill $SERVER_PID || true
            exit 1
          fi
          
          # Stop server
          kill $SERVER_PID || true
          echo "Build and test completed successfully"
