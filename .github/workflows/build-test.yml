name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and validate opencode package
        run: |
          # Build opencode package (creates ./result symlink)
          echo "Building opencode..."
          nix build .#opencode
          
          # Validate that the binary works by running version check
          echo "Validating opencode binary..."
          ./result/bin/opencode --version
          
          echo "Build and validation completed successfully"
